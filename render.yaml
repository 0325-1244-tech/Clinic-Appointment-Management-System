# Render Blueprint: deploys CareConnect (JavaScript version) as a Node web service.
# In Render: New + -> Blueprint -> pick this repository and the `javascript-version` branch.
#
# Official mode: the clinic starts empty, there are no demo accounts, and every
# record is stored permanently in PostgreSQL (for example a free Neon database).
# Render asks for the three secret values below when the Blueprint is created.
services:
  - type: web
    name: careconnect-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: CLINIC_TIME_ZONE
        value: Asia/Manila
      # PostgreSQL connection string, e.g. from neon.tech:
      # postgresql://user:password@ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The first administrator. Created once, the first time the service starts
      # with an empty database. Use a password of 10+ characters and keep it private.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
